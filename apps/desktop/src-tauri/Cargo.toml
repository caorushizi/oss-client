[package]
name = "oss-client"
version = "0.1.0"
description = "A multi-cloud object storage desktop client"
authors = ["caorushizi"]
edition = "2021"

[lib]
name = "oss_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-http = "2.6.0"
tauri-plugin-shell = "2.3.6"
tokio = { version = "1", features = ["time"] }
